services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai_employee_backend
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/data
      - chroma_data:/app/chroma_db
      - model_cache:/root/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./.env
    environment:
      DATABASE_URL: sqlite:////app/data/ai_employee.db
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    container_name: ai_employee_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    restart: unless-stopped

volumes:
  sqlite_data:
  chroma_data:
  model_cache:
